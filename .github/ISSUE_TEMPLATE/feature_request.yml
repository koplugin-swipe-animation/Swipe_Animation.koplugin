name: 功能建议 / Feature request
description: 建议新功能或改进现有翻页动画行为。Suggest a feature or change.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本仓库是 KOReader 的**软件擦除翻页动画**补丁，面向 Kindle / Kobo 等 Linux 墨水屏。

        Android 不在支持范围内。设置项目前包括：刷新模式（UI / Fast）、横竖屏帧延迟、轻度全局刷新。

        This repo is a software wipe page-turn animation patch for KOReader on Linux e-ink devices. Android is out of scope.

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前 / Before submitting
      options:
        - label: 已搜索过现有 issue / I searched existing issues
          required: true
        - label: 这不是 Android 专用需求 / This is not an Android-only request
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 建议方向 / Area
      options:
        - 动画效果 / Animation look
        - 速度与延迟 / Speed and delay
        - 刷新模式 / 残影 / Refresh mode or ghosting
        - 固定版式（PDF / DjVu / CBZ）/ Fixed-layout books
        - 设置菜单 / Settings UI
        - 设备兼容（Kindle / Kobo / MTK）/ Device support
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题 / What problem is this
      description: 现在的行为哪里不够用？中英文均可。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 希望怎样 / What you want
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已经试过的办法 / Alternatives you tried
      description: 例如改过帧延迟、切过 UI/Fast、开关轻度全局刷新、调过完全刷新速率。
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: 你的设备（可选）/ Your device (optional)
      placeholder: Kobo Libra Colour / Kindle Oasis / …
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充 / Extra context
    validations:
      required: false
